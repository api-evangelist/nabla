- aid: nabla:nabla-copilot-server-api
  name: Nabla Copilot Server API
  description: >-
    The Server API is intended for server-to-server interactions, allowing backend systems to manage Copilot
    users and resources via OAuth 2.0 client credentials. OAuth clients can be configured with a JWKS
    URL (preferred for key rotation) or a static X.509-encoded public key.
  humanURL: https://docs.nabla.com/server/jwt-authenticate-copilot-user/
  baseURL: https://api.nabla.com
  tags:
  - Server API

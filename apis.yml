- aid: nabla:nabla-copilot-user-api
  name: Nabla Copilot User API
  description: >-
    The User API enables client-side applications to act on behalf of an individual user by exchanging
    server-issued access and refresh tokens to autonomously call the Nabla Core API. Includes WebSocket
    transcription for live medical encounters via /user/copilot/listen.
  humanURL: https://docs.nabla.com/user/copilot-listen-ws/
  baseURL: https://api.nabla.com

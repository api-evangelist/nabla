apis:
- aid: nabla:nabla-core-api
  name: Nabla Core API
  description: >-
    The Nabla Core API transcribes medical encounters, generates structured clinical notes (for example
    SOAP), extracts FHIR-normalized data with ICD-10 and LOINC coding, produces multilingual patient-facing
    summaries, and supports magic edit, dictation, dot phrases, custom dictionaries, and feedback reporting.
    The API offers REST, WebSocket, and asynchronous endpoints, with audio file support up to 60 minutes.
  humanURL: https://docs.nabla.com/
  baseURL: https://api.nabla.com
  tags:
